<!DOCTYPE html>
<html>
  <head>
    <title>simple</title>
    <style>
    * {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

body {
  background-color: #050505;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.container {
  position: relative;
  width: 100%;
  height: 100vh;

  /* Allows translateZ() to create a 3D effect */
  perspective: 800px;

  /* Keeps the moving elements inside */
  overflow: hidden;
}


.container::after {
  content: " ";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(21, 21, 21, 0.199);
  -webkit-backdrop-filter: blur(100px);
  backdrop-filter: blur(100px);
  pointer-events: none;
  z-index: 1;
}


.container div {
  position: absolute;
  color: transparent;
  z-index: 2;
  background-color: #ffffff;
  z-index: 0;
}


.container div:nth-child(1) {
  top: 0;
  left: 0;

  width: 100px;
  height: 100px;

  border-radius: 50%;

  animation: moveOne 3s infinite alternate ease-in-out;
}

@keyframes moveOne {
  from {
    transform: translate3d(0, 0, 0);
  }

  to {
    transform: translate3d(600px, 500px, 300px);
  }
}



.container div:nth-child(2) {
  top: 500px;
  right: 300px;

  width: 40px;
  height: 40px;

  border-radius: 50%;

  animation: moveTwo 3s infinite alternate ease-in-out;
}

@keyframes moveTwo {
  from {
    transform: translate3d(0, 0, 0);
  }

  to {
    transform: translate3d(-600px, -200px, 100px);
  }
}



.container div:nth-child(3) {
  top: 100px;
  right: 0;

  width: 200px;
  height: 200px;

  border-radius: 50%;

  animation: moveThree 3s infinite alternate ease-in-out;
}

@keyframes moveThree {
  from {
    transform: translate3d(0, 0, 0);
  }

  to {
    transform: translate3d(-200px, 700px, 40px);
  }
}
    </style>
  </head>
  <body>
    <div id="container" class="container"></div>
    
  </body>
  <script>
      const dataArray = [1, 2, 3];
      document.getElementById("container").innerHTML = dataArray.map((item) => {
              return `<div class="sub-${item}">${item}</div>`;
              }).join(" ");
    </script>
</html>
