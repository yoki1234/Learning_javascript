<!DOCTYPE html>
<html>
  <head>
    <title>memories-game</title>
    <style>
      *{
        padding: 0;
        margin: 0;
      }

      body{
        width: 100%;
        height: 100vh;
        background-color: rgb(191, 191, 213);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      
      .container{
        display: flex;
        flex-direction: column;
        gap: 50px;
        width: fit-content;
        height:fit-content;
      }

      #imgContainer{
        width: 300px;
        height: 250px;
        box-shadow: 5px 5px 20px 2px rgb(68, 56, 56);
        border-radius: 40px;
      }

      #imgContainer img{
        width: 100%;
        height: 100%;
        border-radius: 40px;
        object-fit: cover;
      }


      .container input{
        width: 100%;
        height: 60px;
        padding-left: 10px;
        border-radius: 20px;
        border: none;
        font-size: 20px;
        text-align: center;
        box-shadow: inset 2px 2px 2px 2px rgb(75, 72, 72);
        background-color: rgb(180, 129, 63);
        font-weight: 600;
        color: white;
      }

      .container input::placeholder{
        color: rgb(249, 245, 245);
      }

      input:focus {
        outline: none;
        border: none;
      }

      #ansContainer {
        min-height: 30px;
        text-align: center;
        font-size: 18px;
        color: rgb(52, 46, 46);
        font-weight: 600;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <div id="imgContainer"></div>
      <input id="typingAns" type="text" placeholder="Type your answer">
      <div id="ansContainer"></div>
    </div>
  </body>
  <script>
    const fruit = ["apple","pineapple","kiwi","lime","banana","fig","mango","watermelon"];

    const fruitURL = {
      "apple":"./assets/apple.jpg",
      "pineapple":"./assets/pineapple.webp",
      "kiwi":"./assets/kiwi.webp",
      "lime":"./assets/lime.webp",
      "banana":"./assets/banana.jpg",
      "fig":"./assets/fig.webp",
      "mango":"./assets/mango.jpg",
      "watermelon":"./assets/watermeloen.jpg"
    }

    const randomFruit = fruit[Math.floor(Math.random() * fruit.length)];

    document.getElementById("imgContainer").innerHTML = `<img src="${fruitURL[randomFruit]}" alt="${randomFruit}">`

    const typingAns = document.getElementById("typingAns");
    const ansContainer = document.getElementById("ansContainer");

    typingAns.addEventListener("input", () => {
      ansContainer.innerHTML = `<div>${typingAns.value}</div>`;
    });

  </script>
</html>
