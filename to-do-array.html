<!DOCTYPE html>
<html>
  <head>
    <title>to-do-list</title>
    <style>
      #container{
        display: flex;
        align-items: start;
        flex-direction: column;
        gap: 20px;
        font-size: 48px;
      }

      .mainArea{
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 50px;
        width: 350px;
        gap: 10px;
      }

      .mainArea input{
        height: 100%;
        width: 100%;
        padding-left: 10px;
        font-size: 18px;
        margin: 0;
      }

      .mainArea button{
        width: fit-content;
        height: 100%;
        padding: 0px 20px;
        font-size: 18px;
        background-color: green;
        color: aliceblue;
        border: none;
        cursor: pointer;
      }

      .list{
        font-size: 18px;
        display: flex;
        align-items: center;
        height: 50px;
        width:350px;
        gap:10px;
        margin-bottom: 10px;
      }

      .list div{
        width: 100%;
        padding-left: 10px;
      }

      .list button{
        font-size: 18px;
        height: 100%;
        padding: 0px 13px;
        width: fit-content;
        background-color: red;
        color: aliceblue;
        border: none;
      }

    </style>
  </head>
  <body>
    <div id="container"></div>
  </body>
  <script>
    const data = {
      "title":"Todo List",
      "placeHolder":"Todo name",
      "btnLabel":"ADD",
      "btnDelet":"Delete"
    }

    const container = document.getElementById("container");

    container.innerHTML = `
      <div>${data.title}</div>
      <div class="mainArea">
        <input id="inputText" type="text" placeholder="${data.placeHolder}">
        <button onClick="submition()" id="submit">${data.btnLabel}</button>
      </div>
      <div id="list"></div>
    `

    const inputText = document.getElementById("inputText");
    const submit = document.getElementById("submit");
    const toDoList = []


    const list = document.getElementById("list");

    function submition(){
      if(inputText.value.trim()!==""){
        toDoList.push(inputText.value.trim());

       
        inputText.value = "";

        list.innerHTML=toDoList.map((item)=>`
        <div class='list'>
          <div>${item}</div>
          <button onClick="listDelete()">${data.btnDelet}</button>
        </div>
        `).join(" ")
      }
    }

    inputText.addEventListener("keydown",function(e){
      if(e.key === "Enter"){
        submition();
      }
    });

    console.log(toDoList);
    function listDelete(){
      if(list)
      list.style.display = "none";
    }

  </script>
</html>
