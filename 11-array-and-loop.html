<!DOCTYPE html>
<html>
  <head>
    <title>Array_and_Loop</title>
    <style>
      *{
        padding: 0;
        margin: 0;
      }

      body{
        background-color: bisque;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
      }

     .container {
          position: relative;
          width: 500px;
          height: 500px;

          /* Allows translateZ() to create a 3D effect */
          perspective: 800px;

          /* Keeps the moving elements inside */
          overflow: hidden;
          border-radius: 20px;
        }


      .container::after {
        content: " ";
        top: 0;
        left: 0;
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(21, 21, 21, 0.199);
        -webkit-backdrop-filter: blur(100px);
        backdrop-filter: blur(100px);
        pointer-events: none;
        z-index: 1;
      }



    </style>
  </head>
  <body>
    <div class="container"></div>
    <div class="animation-bg"></div>
  </body>
  <script>
    const triangleData = [10, 20, 30, 35, 10, 20, 30, 45, 50, 23, 33, 56, 70, 12, 8, 6, 3];

    const numberBalls = [...Array(10).keys()].map(x => x*3 + 1);
    console.log(numberBalls);

    const bgAnimation = document.querySelector(".animation-bg");
    const w = numberBalls[Math.floor(Math.random() * numberBalls.length)];

    console.log(w);

    bgAnimation.innerHTML = numberBalls.map((item) => `
      <div style="width: ${item}px; height: ${item}px; background-color: red;">
        ${item}
      </div>
    `).join("");
    
  </script>
</html>
